final String mcVersion = project.minecraft_version
final boolean unobfuscated = mcVersion.startsWith('26')
// 1.19.4 / 1.20.1 run on Java 17, 1.21.x on 21 and 26.x on 25; see versions/<v>/gradle.properties.
final int javaVersion = project.java_version as int

apply plugin: 'maven-publish'
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

repositories {
    mavenCentral()
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    def processDependency = { dep ->
        if (dep instanceof ModuleDependency) {
            if (!(dep.group == 'net.fabricmc' && dep.name == 'fabric-loader')) {
                dep.exclude group: 'net.fabricmc', module: 'fabric-loader'
            }
        }
        return dep
    }
    def autoImplementation = { Object... args -> processDependency(unobfuscated ? implementation(*args) : modImplementation(*args)) }
    def autoCompileOnly = { Object... args -> processDependency(unobfuscated ? compileOnly(*args) : modCompileOnly(*args)) }
    def autoRuntimeOnly = { Object... args -> processDependency(unobfuscated ? runtimeOnly(*args) : modLocalRuntime(*args)) }

    minecraft "com.mojang:minecraft:${mcVersion}"
    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }
    autoImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    autoImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    autoImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    autoCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    autoRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java.srcDirs = [rootProject.file('src/main/java'), rootProject.file("src/versions/${project.name}/java")]
        resources.srcDirs = [rootProject.file('src/main/resources'), rootProject.file("src/versions/${project.name}/resources")]
    }
    test {
        java.srcDirs = [rootProject.file('src/test/java')]
    }
}

loom {
    runConfigs.configureEach {
        runDir = rootProject.file('run')
        ideConfigGenerated = true
    }
}

group = project.maven_group
version = project.mod_version
base {
    archivesName = "${project.archives_base_name}-mc${mcVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

processResources {
    def modProperties = [
            version             : project.mod_version,
            minecraft_dependency: project.minecraft_dependency,
            java_dependency     : ">=${javaVersion}"
    ]
    inputs.properties(modProperties)
    filesMatching('fabric.mod.json') {
        expand modProperties
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

test {
    useJUnitPlatform()
}
